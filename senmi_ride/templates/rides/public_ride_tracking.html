<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track My Senmi Ride</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f7;
            color: #1f1f1f;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #5b2cff;
            margin-bottom: 6px;
        }

        .subtitle {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow:
                0 5px 25px rgba(158, 46, 176, 0.06);
        }

        .status-card {
            text-align: center;
        }

        .status-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 8px;
        }

        .status {
            font-size: 25px;
            font-weight: 800;
            color: #5b2cff;
        }

        .eta {
            margin-top: 8px;
            color: #555;
            font-size: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .location {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .location:last-child {
            margin-bottom: 0;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .pickup-dot {
            background: #2e7d32;
        }

        .destination-dot {
            background: #d32f2f;
        }

        .location-content {
            flex: 1;
        }

        .location-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 3px;
        }

        .location-address {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
        }

        .driver {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .driver-image-container {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #eeeeee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .driver-image {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            background: #eeeeee;
            display: block;
        }

        .driver-placeholder {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #eeeeee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            flex-shrink: 0;
        }

        .driver-name {
            font-weight: 800;
            font-size: 16px;
        }

        .vehicle {
            margin-top: 4px;
            color: #666;
            font-size: 13px;
        }

        .driver-location {
            margin-top: 14px;
            padding: 12px;
            border-radius: 12px;
            background: #f4f1ff;
            color: #4b2abf;
            font-size: 13px;
            line-height: 1.5;
        }

        .map-link {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            background: #5b2cff;
            color: #ffffff;
            font-weight: 700;
        }

        .updated {
            text-align: center;
            color: #888;
            font-size: 11px;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 35px 15px;
            color: #777;
        }

        .error {
            text-align: center;
            padding: 25px 15px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .error-message {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>


<body>

<div class="page">

    <div class="container">

        <div class="header">

            <div class="logo">
                SENMI
            </div>

            <p class="subtitle">
                Live Ride Tracking
            </p>

        </div>


        <div
            id="loadingCard"
            class="card loading"
        >
            Loading live ride...
        </div>


        <div
            id="errorCard"
            class="card error hidden"
        >

            <div class="error-title">
                Unable to Load Ride
            </div>

            <div
                id="errorMessage"
                class="error-message"
            >
                Please try again.
            </div>

        </div>


        <div
            id="rideContent"
            class="hidden"
        >

            <div class="card status-card">

                <div class="status-label">
                    Ride Status
                </div>

                <div
                    id="rideStatus"
                    class="status"
                >
                    Loading...
                </div>

                <div
                    id="eta"
                    class="eta"
                ></div>

            </div>


            <div class="card">

                <div class="section-title">
                    Trip
                </div>


                <div class="location">

                    <div class="dot pickup-dot"></div>

                    <div class="location-content">

                        <div class="location-label">
                            PICKUP
                        </div>

                        <div
                            id="pickupAddress"
                            class="location-address"
                        >
                            -
                        </div>

                    </div>

                </div>


                <div class="location">

                    <div class="dot destination-dot"></div>

                    <div class="location-content">

                        <div class="location-label">
                            DESTINATION
                        </div>

                        <div
                            id="destinationAddress"
                            class="location-address"
                        >
                            -
                        </div>

                    </div>

                </div>

            </div>


            <div class="card">

                <div class="section-title">
                    Driver
                </div>


                <div class="driver">

                    <div
                        id="driverImageContainer"
                        class="driver-image-container"
                    >

                        <span
                            id="driverPlaceholderIcon"
                            class="driver-placeholder"
                        >
                            🚗
                        </span>

                        <img
                            id="driverImage"
                            class="driver-image hidden"
                            src=""
                            alt="Driver"
                        >

                    </div>


                    <div>

                        <div
                            id="driverName"
                            class="driver-name"
                        >
                            Driver not assigned
                        </div>

                        <div
                            id="vehicleNumber"
                            class="vehicle"
                        ></div>

                    </div>

                </div>


                <div
                    id="driverLocation"
                    class="driver-location hidden"
                >
                    Driver location is updating...
                </div>


                <a
                    id="mapLink"
                    class="map-link hidden"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View Driver Location
                </a>

            </div>


            <div
                id="updatedAt"
                class="updated"
            ></div>

        </div>

    </div>

</div>


<script>

    /*
     * Public ride tracking token
     */

    const shareToken =
        "{{ token|escapejs }}";


    /*
     * Public API endpoint
     */

    const apiUrl =
        "/api/ride/rides/shared/"
        + encodeURIComponent(shareToken)
        + "/";


    /*
     * Main page elements
     */

    const loadingCard =
        document.getElementById(
            "loadingCard"
        );


    const errorCard =
        document.getElementById(
            "errorCard"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const rideContent =
        document.getElementById(
            "rideContent"
        );


    /*
     * Show an error
     */

    function showError(message) {

        loadingCard.classList.add(
            "hidden"
        );

        rideContent.classList.add(
            "hidden"
        );

        errorCard.classList.remove(
            "hidden"
        );

        errorMessage.textContent =
            message ||
            "Unable to load the shared ride.";

    }


    /*
     * Format ride status
     */

    function formatStatus(status) {

        if (!status) {

            return "Unknown";

        }


        return status
            .toString()
            .replaceAll("_", " ")
            .replace(/\b\w/g, function(letter) {

                return letter.toUpperCase();

            });

    }


    /*
     * Format date/time
     */

    function formatDate(value) {

        if (!value) {

            return "";

        }


        try {

            return new Date(
                value
            ).toLocaleString();

        } catch (error) {

            return value;

        }

    }


    /*
     * Load public ride information
     *
     * This function runs every 5 seconds.
     */

    async function loadRide() {

        try {

            const response =
                await fetch(
                    apiUrl,
                    {
                        method: "GET",

                        headers: {
                            "Accept":
                                "application/json"
                        },

                        cache: "no-store"
                    }
                );


            /*
             * Parse JSON response
             */

            let data = null;


            try {

                data =
                    await response.json();

            } catch (error) {

                throw new Error(
                    "The server returned an invalid response."
                );

            }


            /*
             * Handle API errors
             */

            if (!response.ok) {

                throw new Error(
                    data?.detail ||
                    data?.message ||
                    "Unable to load shared ride."
                );

            }


            /*
             * Show ride content
             */

            loadingCard.classList.add(
                "hidden"
            );

            errorCard.classList.add(
                "hidden"
            );

            rideContent.classList.remove(
                "hidden"
            );


            /*
             * Ride status
             */

            const rideStatus =
                document.getElementById(
                    "rideStatus"
                );


            if (rideStatus) {

                rideStatus.textContent =
                    formatStatus(
                        data?.status
                    );

            }


            /*
             * Pickup address
             */

            const pickupAddress =
                document.getElementById(
                    "pickupAddress"
                );


            if (pickupAddress) {

                pickupAddress.textContent =
                    data?.pickup?.address ||
                    "Pickup location unavailable";

            }


            /*
             * Destination address
             */

            const destinationAddress =
                document.getElementById(
                    "destinationAddress"
                );


            if (destinationAddress) {

                destinationAddress.textContent =
                    data?.destination?.address ||
                    "Destination unavailable";

            }


            /*
             * Driver name
             */

            const driverName =
                data?.driver?.name;


            const driverNameElement =
                document.getElementById(
                    "driverName"
                );


            if (driverNameElement) {

                driverNameElement.textContent =
                    driverName ||
                    "Driver not assigned";

            }


            /*
             * Vehicle number
             */

            const vehicleNumber =
                data?.driver?.vehicle_number;


            const vehicleNumberElement =
                document.getElementById(
                    "vehicleNumber"
                );


            if (vehicleNumberElement) {

                vehicleNumberElement.textContent =
                    vehicleNumber
                        ? "Vehicle: "
                            + vehicleNumber
                        : "";

            }


            /*
             * Driver image
             */

            const driverImage =
                data?.driver?.image;


            const imageContainer =
                document.getElementById(
                    "driverImageContainer"
                );


            const driverImageElement =
                document.getElementById(
                    "driverImage"
                );


            const driverPlaceholderIcon =
                document.getElementById(
                    "driverPlaceholderIcon"
                );


            if (
                imageContainer &&
                driverImageElement &&
                driverPlaceholderIcon
            ) {

                if (driverImage) {

                    driverImageElement.src =
                        driverImage;


                    driverImageElement.classList.remove(
                        "hidden"
                    );


                    driverPlaceholderIcon.classList.add(
                        "hidden"
                    );

                } else {

                    driverImageElement.src = "";

                    driverImageElement.classList.add(
                        "hidden"
                    );


                    driverPlaceholderIcon.classList.remove(
                        "hidden"
                    );

                }

            }


            /*
             * ETA
             */

            const eta =
                document.getElementById(
                    "eta"
                );


            if (eta) {

                if (
                    data?.eta_minutes !== null &&
                    data?.eta_minutes !== undefined
                ) {

                    eta.textContent =
                        "Estimated arrival: "
                        + data.eta_minutes
                        + " minutes";

                } else {

                    eta.textContent = "";

                }

            }


            /*
             * Driver location
             */

            const driverLocation =
                data?.driver_location;


            const driverLocationBox =
                document.getElementById(
                    "driverLocation"
                );


            const mapLink =
                document.getElementById(
                    "mapLink"
                );


            if (
                driverLocation &&
                driverLocation.lat !== null &&
                driverLocation.lat !== undefined &&
                driverLocation.lng !== null &&
                driverLocation.lng !== undefined
            ) {

                /*
                 * Show driver location message
                 * AND STREET ADDRESS.
                 */

                if (driverLocationBox) {

                    driverLocationBox.classList.remove(
                        "hidden"
                    );


                    if (driverLocation.address) {

                        driverLocationBox.textContent =
                            "Driver is currently on "
                            + driverLocation.address;

                    } else {

                        driverLocationBox.textContent =
                            "Driver location is available and updating live.";

                    }

                }


                /*
                 * Google Maps link.
                 */

                const mapUrl =
                    "https://www.google.com/maps/search/?api=1"
                    + "&query="
                    + encodeURIComponent(
                        driverLocation.lat
                        + ","
                        + driverLocation.lng
                    );


                if (mapLink) {

                    mapLink.href =
                        mapUrl;


                    mapLink.classList.remove(
                        "hidden"
                    );

                }

            } else {

                /*
                 * Driver location is not available yet.
                 */

                if (driverLocationBox) {

                    driverLocationBox.classList.add(
                        "hidden"
                    );

                }


                if (mapLink) {

                    mapLink.classList.add(
                        "hidden"
                    );

                    mapLink.removeAttribute(
                        "href"
                    );

                }

            }


            /*
             * Last driver location update
             */

            const updatedAt =
                driverLocation?.updated_at;


            const updatedAtElement =
                document.getElementById(
                    "updatedAt"
                );


            if (updatedAtElement) {

                updatedAtElement.textContent =
                    updatedAt
                        ? "Last location update: "
                            + formatDate(
                                updatedAt
                            )
                        : "Waiting for driver location...";

            }


        } catch (error) {

            /*
             * Log the actual error in browser console.
             */

            console.error(
                "Shared ride error:",
                error
            );


            /*
             * Show friendly error to user.
             */

            showError(
                error?.message ||
                "Unable to load the shared ride."
            );

        }

    }


    /*
     * Load immediately when page opens.
     */

    loadRide();


    /*
     * Refresh live ride information every 5 seconds.
     */

    setInterval(
        loadRide,
        5000
    );

</script>


</body>

</html>
